name: outsider-issue-to-bot-pr
on:
  issues:
    types: [opened]
permissions:
  contents: write
  pull-requests: write
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: create bot PR using issue body as benign Gradle input
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="outsider-issue-${ISSUE_NUM}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          printf '\n%s\n' "$ISSUE_BODY" >> build.gradle
          git add build.gradle
          git commit -m "issue ${ISSUE_NUM} generated build change"
          git push origin HEAD
          gh pr create --base main --head "$branch" --title "Outsider issue ${ISSUE_NUM} bot PR" --body "Generated by github-actions[bot] from outsider issue ${ISSUE_NUM}."
